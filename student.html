<!DOCTYPE html><html><head>  <meta charset="UTF-8">  <title>Forschungsprojekt "digitale Becherampel"</title>  <script src="https://unpkg.com/@supabase/supabase-js"></script></head><body style="font-family:sans-serif; text-align:center;"><h2 style="font-size:30px;">Wie gut verstehst du das aktuelle Thema / den aktuellen Stoff?</h2><button onclick="sendAmpel('grün')" style="font-size:30px;">🟢 Ich verstehe es</button><br><br><button onclick="sendAmpel('gelb')" style="font-size:30px;">🟡 Ich bin unsicher</button><br><br><button onclick="sendAmpel('rot')" style="font-size:30px;">🔴 Ich verstehe es nicht</button><br><br><textarea id="frage" placeholder="Was ist gerade unklar?" rows="6" cols="67" style="font-size:18px; padding:5px;"></textarea><br><button onclick="sendQuestion()" style="font-size:20px; padding: 10px 20px;">Frage absenden</button><p style="font-size:12px;">Deine Frage / Rückmeldung ist anonym.</p><script>const supabase = supabase.createClient(  'https://txlkkjvwjljnqskoosok.supabase.co',  'sb_publishable_qby-TNj8gJBFTHRgMSmNEw_5wmXwICC')const sessionId = new URLSearchParams(window.location.search).get("session")const studentId = "Schüler_" + Math.floor(Math.random()*100000)function sendAmpel(color) {  supabase.from('events').insert({    session_id: sessionId,    student_id: studentId,    type: 'ampel',    value: color  })}function sendQuestion() {  const text = document.getElementById("frage").value  if (!text) return  supabase.from('events').insert({    session_id: sessionId,    student_id: studentId,    type: 'question',    value: text  })  document.getElementById("frage").value = ""}</script></body></html>
