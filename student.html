<!DOCTYPE html><html><head>  <meta charset="UTF-8">  <title>Forschungsprojekt "digitale Becherampel"</title>  <script src="https://unpkg.com/@supabase/supabase-js"></script>  <style>    body { font-family: sans-serif; text-align: center; padding: 20px; }    h2 { font-size: 28px; margin-bottom: 20px; }    button { font-size: 28px; padding: 15px 30px; margin: 10px; cursor: pointer; }    textarea { font-size: 18px; padding: 10px; width: 90%; max-width: 400px; margin-bottom: 10px; }    input { font-size: 18px; padding: 5px 10px; }  </style></head><body><h2>Wie gut verstehst du das aktuelle Thema / den aktuellen Stoff?</h2><!-- Session-Code Eingabe --><div style="margin-bottom: 20px;">  <label for="sessionInput">Session-Code eingeben:</label><br>  <input type="text" id="sessionInput" placeholder="z.B. ABC123">  <button onclick="startSession()">Verbinden</button></div><!-- Ampel-Buttons --><div>  <button onclick="sendAmpel('grün')">🟢 Ich verstehe es</button>  <button onclick="sendAmpel('gelb')">🟡 Ich bin unsicher</button>  <button onclick="sendAmpel('rot')">🔴 Ich verstehe es nicht</button></div><!-- Fragefeld --><div style="margin-top: 20px;">  <textarea id="frage" placeholder="Was ist gerade unklar?" rows="4"></textarea><br>  <button onclick="sendQuestion()">Frage absenden</button></div><p style="font-size: 14px; margin-top: 20px;">Deine Rückmeldung ist anonym.</p><script>  // Supabase einrichten  const supabase = supabase.createClient(    'https://txlkkjvwjljnqskoosok.supabase.co',  // <--- hier deine Supabase Project URL einfügen    'sb_publishable_qby-TNj8gJBFTHRgMSmNEw_5wmXwICC'  // <--- hier deinen Public Key einfügen  );  let sessionId = null;  const studentId = "Schüler_" + Math.floor(Math.random() * 100000);  function startSession() {    const input = document.getElementById("sessionInput").value.trim();    if (!input) {      alert("Bitte Session-Code eingeben!");      return;    }    sessionId = input;    document.getElementById("sessionInput").disabled = true;    alert("Session verbunden! Du kannst jetzt Ampel klicken und Fragen stellen.");  }  function sendAmpel(color) {    if (!sessionId) { alert("Bitte zuerst Session-Code eingeben!"); return; }    supabase.from('events').insert({      session_id: sessionId,      student_id: studentId,      type: 'ampel',      value: color    });  }  function sendQuestion() {    if (!sessionId) { alert("Bitte zuerst Session-Code eingeben!"); return; }    const text = document.getElementById("frage").value.trim();    if (!text) return;    supabase.from('events').insert({      session_id: sessionId,      student_id: studentId,      type: 'question',      value: text    });    document.getElementById("frage").value = "";    alert("Frage gesendet!");  }</script></body></html>
